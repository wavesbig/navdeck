<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title">
  <title id="title">NavDeck Mark</title>
  <style>
    :root { color-scheme: light dark; }
    .mark { fill: #0A1317; }
    .accent { fill: #E5484D; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #DFE2E5; }
    }
  </style>
  <g class="mark">
    <rect x="5" y="6" width="5" height="20" rx="1.6" />
    <rect x="22" y="6" width="5" height="20" rx="1.6" />
    <rect x="10" y="8" width="4" height="4" rx="1" />
    <rect x="14" y="12" width="4" height="4" rx="1" />
  </g>
  <rect class="accent" x="18" y="16" width="4" height="4" rx="1" />
</svg>

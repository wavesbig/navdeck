<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title">
  <title id="title">NavDeck Mark</title>
  <style>
    :root { color-scheme: light dark; }
    .mark { fill: #0A1317; }
    .accent { fill: #E5484D; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #DFE2E5; }
    }
  </style>
  <g class="mark">
    <rect x="6" y="6" width="4" height="20" rx="1.2" />
    <rect x="22" y="6" width="4" height="20" rx="1.2" />
    <rect x="10.4" y="9.2" width="3.2" height="3.2" />
    <rect x="13.6" y="12.4" width="3.2" height="3.2" />
    <rect x="16.8" y="15.6" width="3.2" height="3.2" />
  </g>
  <rect class="accent" x="20" y="18.8" width="3.2" height="3.2" />
</svg>
